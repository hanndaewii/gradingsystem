# Cloudflare Pages project configuration.
#
#   • Build command:        npm run build
#   • Build output dir:     dist   (pages_build_output_dir below)
#   • Root directory:       /  (repo root)
#   • Deploy command:       npm run deploy
#                            (scripts/deploy-pages.mjs → wrangler pages deploy dist
#                             --project-name=gradingsystem). This uses the Pages
#                            flavour; plain `npx wrangler deploy` is the Workers
#                            command and fails on a Pages project.
#                            IMPORTANT: delete any custom CLOUDFLARE_API_TOKEN
#                            from the project settings — it overrides the build
#                            environment's own scoped credential and usually
#                            lacks "Cloudflare Pages: Edit".
#
# Build-time environment variables — set BOTH in Dashboard → Pages project →
# Settings → Environment variables (Production + Preview):
#   • VITE_SUPABASE_URL
#   • VITE_SUPABASE_ANON_KEY
# These are baked into the bundle at build time; changing them requires a
# rebuild. NEVER set SUPABASE_SECRET_KEY or DATABASE_URL as a Pages build
# variable — they are server-side only and would ship to every browser.

name = "gradingsystem"
pages_build_output_dir = "dist"
